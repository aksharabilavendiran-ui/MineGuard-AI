services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mineguard}
      POSTGRES_USER: ${POSTGRES_USER:-mineguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mineguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/db-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mineguard} -d ${POSTGRES_DB:-mineguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    environment:
      PORT: 8000
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mineguard}:${POSTGRES_PASSWORD:-mineguard}@postgres:5432/${POSTGRES_DB:-mineguard}
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: ${JWT_SECRET:-mineguard-demo-secret}
      CORS_ORIGIN: http://localhost:5173
      SIMULATOR_INTERVAL_MS: 3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  simulator:
    build: ./simulator
    environment:
      API_URL: http://backend:4000
      SIMULATOR_INTERVAL_MS: 3000
    depends_on:
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_SOCKET_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data: